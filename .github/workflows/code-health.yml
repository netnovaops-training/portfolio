# Whole-repo code health: on every push, every pull request and once a day.
# Thin caller; the checks live in netnovaops-training/Toolbox (shared-code-health.yml), pinned by commit.
name: code-health

on:
  push:
    branches-ignore: ['dependabot/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    # Pinned to the Toolbox commit that adds osv-scanner --allow-no-lockfiles: this repo has no
    # lock file, so the old pin left a "No lockfiles found" warning on every run (2026-11-19).
    uses: netnovaops-training/Toolbox/.github/workflows/shared-code-health.yml@5f96936a968720e2d36701c71ba129734d13f385 # main (Toolbox fix/github-findings-2026-11-19)
    permissions:
      contents: read
      actions: read
      security-events: write # SARIF upload (public repo)
